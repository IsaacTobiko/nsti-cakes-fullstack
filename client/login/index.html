<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Isaac_Tobiko" />
    <meta name="description" content="Login to your NSTI Bakery account." />
    <link rel="icon" type="image/png" href="favicon.png" />
    <title>NSTI Bakery | Login</title>
    <link rel="stylesheet" href="../src/output.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <header></header>
    <main>
      <div class="bg-maroon">
        <h2 class="text-white">
          Baked with
          <p class="text-gold">Love &amp; Care</p>
        </h2>
        <p class="text-white">
          Join the Nairobi South Training Institute Bakery family. Order
          handcrafted cakes for every occasion, from birthdays to weddings.
        </p>
      </div>
      <div>
        <h1>Welcome Back</h1>
        <p>
          Don't have an account? <a href="../sign-up/index.html">Sign up</a>
        </p>
        <form action="/login" method="POST">
          <label for="email">Email Address </label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="email@example.com"
            required
          />
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
          />
          <label for="remember">
            <input type="checkbox" name="remember" id="remember" />Remember me
          </label>
          <a href="../forgot-password/index.html">Forgot password?</a>
          <button type="submit">Login to your account</button>
        </form>
      </div>
      <div>
        <p>OR CONTINUE WITH</p>
        <button type="button">Continue with Google</button>
        <p>
          New here? <a href="../sign-up/index.html">Create a new account</a> and
          start ordering today.
        </p>
      </div>
    </main>
    <footer></footer>
  </body>
</html>
