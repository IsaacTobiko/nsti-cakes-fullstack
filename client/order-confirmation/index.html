<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title first -->
    <title>Order Confirmation | NSTI Cakes</title>

    <!-- Primary SEO -->
    <meta
      name="description"
      content="Your NSTI Cakes order has been confirmed. Thank you for ordering from Nairobi South Training Institute!"
    />
    <meta name="author" content="Nairobi South Training Institute" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Open Graph -->
    <meta property="og:title" content="Order Confirmation | NSTI Cakes" />
    <meta
      property="og:description"
      content="Your NSTI Cakes order has been confirmed!"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nsti.ac.ke/order-confirmation" />
    <meta property="og:image" content="../assets/images/og-image.jpg" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../assets/icons/favicon.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Stylesheet -->
    <link rel="stylesheet" href="../src/output.css" />
  </head>

  <body class="bg-[#421625] text-[#FFFFFF] min-h-screen flex flex-col">
    <header role="banner" aria-label="Site Header"></header>

    <main
      role="main"
      aria-label="Order Confirmation"
      class="flex flex-1 items-center justify-center text-center"
    >
      <section
        aria-labelledby="confirmation-heading"
        class="px-6 max-w-lg mx-auto"
      >
        <div
          class="w-20 h-20 rounded-full bg-[#B9861E] mx-auto mt-8 flex items-center justify-center animate-pop"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-10 h-10 text-white"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M5 13l4 4L19 7"
            />
          </svg>
        </div>
        <h1
          id="confirmation-heading"
          class="animate-fade-up delay-1 text-2xl md:text-3xl lg:text-4xl font-semibold mt-6"
        >
          Order
          <span class="text-[#B9861E]">Confirmed!</span>
        </h1>
        <p
          class="animate-fade-up delay-2 text-sm md:text-base lg:text-lg text-gray-300 mt-3"
        >
          Thank you for your order! Your cakes are being freshly prepared with
          love. We'll contact you to confirm delivery.
        </p>
        <p
          class="animate-fade-up delay-3 mt-8 bg-[#572F3D] px-8 py-4 rounded-full inline-block text-sm md:text-base lg:text-lg"
        >
          Order ID:
          <span id="orderId" class="text-[#B9861E]">ORD-XXXXXXXX</span>
        </p>
      </section>
    </main>

    <footer role="contentinfo" aria-label="Site Footer"></footer>

    <script src="./order-confirmation.js" defer></script>
  </body>
</html>
