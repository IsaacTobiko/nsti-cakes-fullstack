<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Isaac_Tobiko" />
    <meta name="description" content="Create your NSTI Bakery account." />
    <link rel="icon" type="image/png" href="favicon.png" />
    <title>NSTI Bakery | Sign Up</title>
    <link rel="stylesheet" href="../src/output.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body class="bg-gray-300 min-h-screen">
    <header></header>
    <main class="flex items-center justify-center min-h-screen">
      <div class="bg-white w-full max-w-lg px-8 py-12 flex flex-col gap-5">
        <h1 class="text-4xl font-bold text-gray-900 mb-4">Sign Up</h1>
        <form action="/sign-up" method="post">
          <div class="flex flex-col gap-1">
            <label for="email" class="text-sm font-semibold text-gray-900"
              >Email Address</label
            >
            <div
              class="flex items-center gap-3 bg-white border border-gray-300 px-3 py-3 rounded-sm"
            >
              <i class="fas fa-envelope text-gray-900"></i>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="email@example.com"
                required
                class="flex-1 text-sm outline-none bg-white"
              />
            </div>
          </div>
          <div>
            <label for="password">Create password</label>
            <div>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Create password"
                required
              />
            </div>
          </div>
          <div>
            <label for="confirm-password">Confirm password</label>
            <div>
              <input
                type="password"
                id="confirm-password"
                name="confirm_password"
                placeholder="Confirm password"
                required
              />
            </div>
          </div>
          <button type="submit" class="bg-maroon">Sign Up</button>
        </form>
        <p>OR CONTINUE WITH</p>
        <button type="button">
          <i class="fab fa-google"></i>
          Continue with Google
        </button>
        <p>Already have an account? <a href="../login/index.html">Login</a></p>
      </div>
    </main>
    <footer></footer>
  </body>
</html>
